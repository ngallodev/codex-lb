# Production Docker Compose — PostgreSQL backend
# Usage:
#   cp .env.example .env.local   # fill in secrets
#   docker compose -f docker-compose.prod.yml up -d
#
# Requires external PostgreSQL. Set CODEX_LB_DATABASE_URL in .env.local:
#   CODEX_LB_DATABASE_URL=postgresql+asyncpg://user:password@host:5432/codexlb
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      CODEX_LB_CLAUDE_CODE_TELEMETRY_SCRAPE_URL: http://otel-collector:9464/metrics
    ports:
      - "2455:2455"
      - "1455:1455"
    volumes:
      - codex-lb-data:/var/lib/codex-lb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2455/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.124.1
    profiles: ["claude-telemetry"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/collector-claude-code.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    restart: unless-stopped

volumes:
  codex-lb-data:
    name: codex-lb-data
